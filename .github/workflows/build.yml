name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fix all files
        run: |
          rm -f app/src/main/java/com/coopbusinesses/cloud/MainActivity.kt
          cat > settings.gradle <<'ENDOFFILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          ENDOFFILE
          echo "// empty" > build.gradle
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/coopbusinesses/cloud
          echo '<resources><string name="app_name">Coop App</string></resources>' > app/src/main/res/values/strings.xml
          echo '<resources><style name="Theme.CoopApp" parent="android:Theme.Light"></style></resources>' > app/src/main/res/values/themes.xml
          cat > app/build.gradle <<'ENDOFFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.coopbusinesses.cloud'
              compileSdk 34
              defaultConfig {
                  applicationId "com.coopbusinesses.cloud"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" android:installLocation="preferExternal">
              <application android:label="Coop App">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDOFFILE
          cat > app/src/main/java/com/coopbusinesses/cloud/MainActivity.java <<'ENDOFFILE'
          package com.coopbusinesses.cloud;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          import android.widget.TextView;
          public class MainActivity extends AppCompatActivity {
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  TextView tv=new TextView(this);
                  tv.setText("Coop App SD Card Ready");
                  setContentView(tv);
              }
          }
          ENDOFFILE

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coop-app-sd-final
          path: app/build/outputs/apk/debug/*.apk